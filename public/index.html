    function renderRoleIcon(camp, role, sizeMode = 'md', isMineSlot = false) {
      const key = (role === undefined || role === null) ? '' : role;
      const effectiveCamp = key === 'unknown' ? 'u' : camp;
      const svgInner = ROLE_SVGS[key] || ROLE_SVGS[''];
      const cls = sizeMode === 'xs' ? 'xs' : (sizeMode === 'sm' ? 'sm' : (sizeMode === 'lg' ? 'lg' : ''));
      const px = sizeMode === 'xs' ? 13 : (sizeMode === 'sm' ? 18 : (sizeMode === 'lg' ? 46 : 24));
      return `
    <span class="role-sq-icon camp-${effectiveCamp} ${cls} ${isMineSlot ? 'is-mine-slot' : ''}">
      <svg width="${px}" height="${px}" viewBox="0 0 32 32">${svgInner}</svg>
    </span>
  `;
    }

    // 統合タイムラインログのレンダリング
    function renderTimelineLogs(entries, players, COLORS) {
      if (!entries || !entries.length) {
        return `<div style="color:var(--muted); font-size:12px;">まだ記録はありません</div>`;
      }
      return entries.map(entry => {
        if (typeof entry === 'string') {
          return `<div class="log-entry"><span>${entry}</span></div>`;
        }
        const isPriv = entry.scope === 'private';
        const iconsHtml = (entry.icons || []).map(ic => {
          if (ic.type === 'char') {
            const p = players.find(x => x.id === ic.id);
            const col = p ? (COLORS[p.color] || COLORS[0]) : COLORS[0];
            const pName = p ? p.name : '?';
            return `
          <span class="log-char-chip">
            ${renderCharacterSvg(col, false, 20, false)}
            <span style="color:${col.light};">${pName}</span>
          </span>
        `;
          }
          if (ic.type === 'grayChar') {
            return `
          <span class="log-char-chip">
            ${renderCharacterSvg(GRAY_COLOR, false, 20, false)}
            <span style="color:#94a3b8;">誰か</span>
          </span>
        `;
          }
          if (ic.type === 'role') return renderRoleIcon(ic.c, ic.role, 'sm', false);
          if (ic.type === 'skull') return renderRoleIcon('n', 'skull', 'sm', false);
          if (ic.type === 'kick') return renderRoleIcon('n', 'kick', 'sm', false);
          if (ic.type === 'ghost') return renderRoleIcon('b', 'gho', 'sm', false);
          if (ic.type === 'mark') {
            return ic.val === 'ok'
              ? `<span class="log-sym-badge" style="color:#56d364; font-weight:900;">⭕</span>`
              : `<span class="log-sym-badge" style="color:#ff7b72; font-weight:900;">❌</span>`;
          }
          return '';
        }).join('');

        return `
      <div class="log-entry ${isPriv ? 'is-private' : ''}">
        <span class="log-day-tag">D${entry.day}</span>
        ${isPriv ? `<span class="log-priv-tag" title="個人ログ">🔒</span>` : ''}
        ${iconsHtml ? `<div class="log-icons-row">${iconsHtml}</div>` : ''}
      </div>
    `;
      }).join('');
    }

    function joinGame() {
      const name = document.getElementById('nameInput').value.trim() || 'プレイヤー';
      localStorage.setItem('mv_name', name);
      document.getElementById('kickedNotice').classList.add('hidden');
      joined = true;
      const savedColor = localStorage.getItem('mv_color');
      socket.emit('join', {uid, name, preferredColor: savedColor !== null ? parseInt(savedColor, 10) : null});
    }

    socket.on('connect', () => {
      if (joined) {
        const savedColor = localStorage.getItem('mv_color');
        socket.emit('join', {
          uid,
          name: localStorage.getItem('mv_name') || 'プレイヤー',
          preferredColor: savedColor !== null ? parseInt(savedColor, 10) : null
        });
      }
    });

    socket.on('kicked', () => {
      joined = false;
      currentState = null;
      clearNightPlayback();
      invHouseResults.clear();
      hideRoleTooltip(true);
      document.body.classList.remove('in-game', 'is-day', 'is-night');
      document.getElementById('skyBackdrop').classList.add('hidden');
      document.getElementById('lobbyScreen').classList.add('hidden');
      document.getElementById('gameScreen').classList.add('hidden');
      document.getElementById('resultScreen').classList.add('hidden');
      document.getElementById('roleRevealOverlay').classList.add('hidden');
      document.getElementById('forceBtn').classList.add('hidden');
      document.getElementById('debugAbortBtn').classList.add('hidden');
      document.getElementById('joinScreen').classList.remove('hidden');
      document.getElementById('kickedNotice').classList.remove('hidden');
    });

    socket.on('spectator', () => {
      alert('現在ゲーム進行中のため、次のゲームから参加できます。');
    });

    socket.on('state', (state) => {
      currentState = state;
      document.getElementById('joinScreen').classList.add('hidden');
      const isHost = state.hostUid === uid;

      if (state.mode === 'lobby') {
        document.body.classList.remove('in-game', 'is-day', 'is-night');
        document.getElementById('skyBackdrop').classList.add('hidden');
        prevPhase = null;
        renderedGid = null;
        lastTimelineCount = 0;
        lastFxKey = null;
        charLastX.clear();
        charFacing.clear();
        invHouseResults.clear();
        clearNightPlayback();
        closeModal();
        document.getElementById('roleRevealOverlay').classList.add('hidden');
        document.getElementById('lobbyScreen').classList.remove('hidden');
        document.getElementById('gameScreen').classList.add('hidden');
        document.getElementById('resultScreen').classList.add('hidden');
        document.getElementById('forceBtn').classList.add('hidden');
        document.getElementById('debugAbortBtn').classList.add('hidden');
        renderLobby(state, isHost);
      } else if (state.showResult) {
        document.body.classList.remove('in-game', 'is-day', 'is-night');
        document.getElementById('skyBackdrop').classList.add('hidden');
        clearNightPlayback();
        closeModal();
        document.getElementById('roleRevealOverlay').classList.add('hidden');
        document.getElementById('lobbyScreen').classList.add('hidden');
        document.getElementById('gameScreen').classList.add('hidden');
        document.getElementById('forceBtn').classList.add('hidden');
        document.getElementById('debugAbortBtn').classList.add('hidden');
        document.getElementById('resultScreen').classList.remove('hidden');
        renderResult(state, isHost);
      } else {
        document.body.classList.add('in-game');
        document.getElementById('skyBackdrop').classList.remove('hidden');
        document.getElementById('lobbyScreen').classList.add('hidden');
        document.getElementById('resultScreen').classList.add('hidden');
        document.getElementById('gameScreen').classList.remove('hidden');
        renderGame(state, isHost);
      }
    });

    function renderLobby(state, isHost) {
      const {COLORS} = state.meta;
      const meUser = state.users.find(u => u.uid === uid);
      if (meUser && typeof meUser.color === 'number') {
        localStorage.setItem('mv_color', meUser.color);
      }

      document.getElementById('hostBadge').classList.toggle('hidden', !isHost);
      document.getElementById('userCount').textContent = state.users.filter(u => u.online).length;

      document.getElementById('userList').innerHTML = state.users.map(u => {
        const col = COLORS[u.color] || COLORS[0];
        const isTargetHost = u.uid === state.hostUid;
        const isMe = u.uid === uid;
        let hostControls = '';
        if (isHost && !isMe) {
          hostControls = `
        <div class="lobby-user-actions">
          ${u.online ? `<button class="secondary" onclick="transferHost('${u.uid}')">👑 譲渡</button>` : ''}
          <button class="danger" onclick="kickUser('${u.uid}')">キック</button>
        </div>
      `;
        }
        return `
      <div class="lobby-user-row">
        <div style="display:flex; align-items:center; gap:8px;">
          <span style="display:inline-block; width:12px; height:12px; border-radius:50%; background:${col.hex}; border:1px solid #fff;"></span>
          <strong>${u.name}</strong>
          ${isTargetHost ? '<span class="badge c-b">👑 ホスト</span>' : ''}
          ${isMe ? '<span style="font-size:11px; color:var(--muted);">(あなた)</span>' : ''}
          ${u.online ? '' : '<span style="font-size:11px; color:#ff7b72;">(オフライン)</span>'}
        </div>
        ${hostControls}
      </div>
    `;
      }).join('');

      const takenByOthers = new Map();
      state.users.forEach(u => {
        if (u.uid !== uid) takenByOthers.set(u.color, u.name);
      });
      document.getElementById('colorGrid').innerHTML = COLORS.map(c => {
        const isSelected = meUser && meUser.color === c.id;
        const owner = takenByOthers.get(c.id);
        return `
      <div class="color-chip ${isSelected ? 'selected' : ''} ${owner ? 'taken' : ''}"
           onclick="${owner ? '' : `selectColor(${c.id})`}">
        ${renderCharacterSvg(c, false, 38)}
        <span>${c.name}</span>
        ${owner ? `<span style="font-size:9px; color:#94a3b8;">${owner}</span>` : ''}
      </div>
    `;
      }).join('');

      const totalInput = document.getElementById('totalInput');
      totalInput.value = state.totalPlayers;
      totalInput.disabled = !isHost;
      document.getElementById('addRoleBar').classList.toggle('hidden', !isHost);
      if (!document.getElementById('newRoleSelect').options.length) {
        updateNewRoleOptions();
      }

      const groups = [];
      const groupMap = new Map();
      state.slots.forEach(s => {
        const key = `${s.c}:${s.role || ''}`;
        if (!groupMap.has(key)) {
          const gObj = {c: s.c, role: s.role || null, label: s.label, count: 0};
          groupMap.set(key, gObj);
          groups.push(gObj);
        }
        groupMap.get(key).count++;
      });

      document.getElementById('slotList').innerHTML = groups.map(g => `
    <div class="role-group-row">
      <div class="role-group-left"
           data-camp="${g.c}" data-role="${g.role || ''}"
           onmouseenter="onRoleIconEnter(this)"
           onmouseleave="onRoleIconLeave()"
           onclick="onRoleIconClick(event, this)">
        ${renderRoleIcon(g.c, g.role, 'md')}
        <div>
          <strong>${g.label}</strong>
          <span class="role-count-tag">×${g.count}</span>
        </div>
      </div>
      ${isHost ? `
        <div class="role-group-btns">
          <button class="secondary" onclick="adjustRoleCount('${g.c}', '${g.role || ''}', -1)">−</button>
          <button class="secondary" onclick="adjustRoleCount('${g.c}', '${g.role || ''}', 1)">＋</button>
        </div>
      ` : ''}
    </div>
  `).join('');

      document.getElementById('errorBox').innerHTML = state.errors.join('<br>');
      const startBtn = document.getElementById('startBtn');
      startBtn.classList.toggle('hidden', !isHost);
      startBtn.disabled = state.errors.length > 0;
    }

    function transferHost(targetUid) {socket.emit('transferHost', targetUid);}
    function kickUser(targetUid) {socket.emit('kickUser', targetUid);}

    function updateNewRoleOptions() {
      if (!currentState) return;
      const {N, G, R, B, CN} = currentState.meta;
      const camp = document.getElementById('newCampSelect').value;
      const roleList = {
        g: ['', ...G, 'fool'],
        r: ['', ...R, ...G],
        b: ['', ...B]
      }[camp];
      document.getElementById('newRoleSelect').innerHTML = roleList.map(r => {
        let text = '';
        if (r === '') text = `${CN[camp]}ランダム`;
        else if (camp === 'r' && G.includes(r)) text = `赤${N[r]}`;
        else text = N[r];
        return `<option value="${r}">${text}</option>`;
      }).join('');
    }

    function selectColor(colorId) {
      localStorage.setItem('mv_color', colorId);
      socket.emit('selectColor', colorId);
    }

    function addSelectedSlot() {
      const c = document.getElementById('newCampSelect').value;
      const role = document.getElementById('newRoleSelect').value || null;
      adjustRoleCount(c, role || '', 1);
    }

    function adjustRoleCount(c, roleStr, delta) {
      const role = roleStr || null;
      const slots = currentState.slots.map(s => ({c: s.c, role: s.role || null}));
      if (delta > 0) {
        slots.push({c, role});
      } else {
        const idx = slots.findIndex(s => s.c === c && (s.role || null) === role);
        if (idx >= 0) slots.splice(idx, 1);
      }
      socket.emit('updateConfig', {totalPlayers: slots.length, slots});
    }

    function syncConfig() {
      const totalPlayers = parseInt(document.getElementById('totalInput').value, 10);
      socket.emit('updateConfig', {totalPlayers});
    }
    function startGame() {socket.emit('startGame');}
    function forceAdvance() {socket.emit('forceAdvance');}
    function backToLobby() {socket.emit('backToLobby');}

    function renderResult(state, isHost) {
      const {view, meta} = state;
      if (!view) return;
      const {over, players, winners, timeline} = view;
      const COLORS = meta.COLORS;
      const winSet = new Set(winners || []);

      document.getElementById('resultWinnerTitle').textContent = '🏆 ' + over;
      document.getElementById('resultBackBtn').classList.toggle('hidden', !isHost);
      document.getElementById('resultWaitHostText').classList.toggle('hidden', isHost);

      document.getElementById('resultPlayerList').innerHTML = players.map(p => {
        const col = COLORS[p.color] || COLORS[0];
        const isWin = winSet.has(p.id);
        const rd = p.fullRoleData || {text: '', icons: []};
        const roleIconsHtml = rd.icons.map((ic, idx) =>
          (idx > 0 ? `<span style="color:var(--muted);">➔</span>` : '') + renderRoleIcon(ic.c, ic.role, 'sm', false)
        ).join('');

        return `
      <div class="result-row ${isWin ? 'is-winner' : ''}">
        <div class="result-player-left">
          ${renderCharacterSvg(col, !p.alive, 38, false)}
          <div>
            <div class="result-name">
              ${p.name} ${isWin ? '👑' : ''}
            </div>
            <div style="font-size:11px; color:${p.alive ? '#56d364' : '#8e9aaf'};">
              ${p.alive ? '生存' : (p.isAsh ? '⚱️ 灰化死亡' : '💀 死亡')}
            </div>
          </div>
        </div>
        <div class="result-role-box">
          ${roleIconsHtml}
          <span>${rd.text}</span>
        </div>
      </div>
    `;
      }).join('');

      document.getElementById('resultLogBox').innerHTML = renderTimelineLogs(timeline, players, COLORS);
    }

    // タイムラインログからもインベスティゲーターの調査結果を復元・同期（再接続時対策）
    function syncInvResultsFromTimeline(view) {
      if (!view || !view.me || view.me.er !== 'inv' || !Array.isArray(view.timeline)) return;
      view.timeline.forEach(entry => {
        if (!entry || entry.scope !== 'private' || !Array.isArray(entry.icons)) return;
        const roleIcons = entry.icons.filter(ic => ic.type === 'role');
        const charIcons = entry.icons.filter(ic => ic.type === 'char');
        const hasInvIcon = roleIcons.some(ic => ic.role === 'inv');
        if (hasInvIcon && roleIcons.length >= 3 && charIcons.length >= 1) {
          const targetChar = charIcons[charIcons.length - 1];
          const choices = roleIcons.slice(-2).map(ic => ({c: ic.c, role: ic.role}));
          if (!invHouseResults.has(targetChar.id)) {
            invHouseResults.set(targetChar.id, choices);
          }
        }
      });
    }

    // 夜の歩行＆アクション再生管理（1イベント = PHASE_TIMERS.nightEvent = 8200ms）
    // step 0 (0ms〜2500ms): 往路歩行（自宅ドア → 相手の家の前）
    // step 1 (2500ms〜3700ms): 実行（ドアに入ってキル/能力実行＆アイコン表示）
    // step 2 (3700ms〜4300ms): 退室（相手の家のドアから手前へ出てくる）
    // step 3 (4300ms〜7400ms): 帰還歩行（相手の家の前から自分の家のドアまで歩いて戻る）
    // step 4 (7400ms〜8200ms): 帰宅入室（自分の家のドアの中へ吸い込まれて消える）
    function startNightEventSteps(ev, idx) {
      clearNightSubTimers();
      activeNightEvent = ev;
      activeNightEventIdx = idx;
      nightSubStep = 0;

      // 2500ms: 相手の家に到着（入室＆能力発動）
      nightSubTimers.push(setTimeout(() => {
        nightSubStep = 1;
        if (ev && ev.kind === 'bomb_blast' && Array.isArray(ev.targets)) {
          ev.targets.forEach(tid => revealedBombedHouses.add(tid));
        }
        if (ev && ev.kind === 'act' && ev.role === 'inv' && Array.isArray(ev.choiceIcons)) {
          invHouseResults.set(ev.target, ev.choiceIcons);
        }
        if (currentState) renderGame(currentState, currentState.hostUid === uid);
      }, 2500));

      // 3700ms: 相手の家のドアから外へ出てくる（ステップアウト）
      nightSubTimers.push(setTimeout(() => {
        nightSubStep = 2;
        if (currentState) renderGame(currentState, currentState.hostUid === uid);
      }, 3700));

      // 4300ms: 自分の家の玄関まで歩いて帰る
      nightSubTimers.push(setTimeout(() => {
        nightSubStep = 3;
        if (currentState) renderGame(currentState, currentState.hostUid === uid);
      }, 4300));

      // 7400ms: 自分の家のドアの中へ入って消える
      nightSubTimers.push(setTimeout(() => {
        nightSubStep = 4;
        if (currentState) renderGame(currentState, currentState.hostUid === uid);
      }, 7400));
    }

    function syncNightPlayback(state) {
      if (state.phaseTransition !== 'nightAction') {
        if (nightPlaybackKey !== null) clearNightPlayback();
        return;
      }
      const events = (state.view && state.view.myNightEvents) || [];
      const key = `${state.view.gid}:${state.view.day}`;
      if (nightPlaybackKey === key) return;

      clearNightPlayback();
      nightPlaybackKey = key;
      if (!events.length) return;

      let idx = 0;
      startNightEventSteps(events[0], 0);
      nightPlaybackTimer = setInterval(() => {
        idx++;
        if (idx < events.length) {
          startNightEventSteps(events[idx], idx);
          if (currentState) renderGame(currentState, currentState.hostUid === uid);
        } else {
          clearInterval(nightPlaybackTimer);
          nightPlaybackTimer = null;
          activeNightEvent = null;
          activeNightEventIdx = -1;
          if (currentState) renderGame(currentState, currentState.hostUid === uid);
        }
      }, PHASE_TIMERS.nightEvent);
    }

    // 移動座標からキャラの向き（左向き・右向き）を更新して適用
    function applyCharacterPositionAndFacing(el, key, leftPct, topPct) {
      const prevX = charLastX.get(key);
      if (prevX !== undefined && Math.abs(leftPct - prevX) > 0.35) {
        charFacing.set(key, leftPct < prevX ? -1 : 1);
      }
      charLastX.set(key, leftPct);
      const facing = charFacing.get(key) || 1;
      const spriteEl = el.querySelector('.char-sprite');
      if (spriteEl) {
        spriteEl.style.setProperty('--facing', facing);
      }
      el.style.left = leftPct + '%';
      el.style.top = topPct + '%';
    }

    function renderGame(state, isHost) {
      const {view, submitted, myNightAction, progress, meta, phaseTransition} = state;
      if (!view) return;
      syncNightPlayback(state);

      const {gid, me, players, timeline, day, ph, over, lastExile, tally, skipCount, majorityNeeded, myVote, roleBar} = view;
      const COLORS = meta.COLORS;

      if (renderedGid !== gid) {
        invHouseResults.clear();
        lastFxKey = null;
      }
      syncInvResultsFromTimeline(view);

      // サーバーと完全同期した現在の死体ズーム対象・ねずみ指さし対象
      const activeMorningDeath = (phaseTransition === 'morningDeaths' && Array.isArray(view.newDeaths))
        ? (view.newDeaths[view.morningDeathIdx || 0] || null)
        : null;
      const activeMorningRat = (phaseTransition === 'morningRat' && Array.isArray(view.morningRats))
        ? (view.morningRats[view.morningRatIdx || 0] || null)
        : null;

      // ゲーム開始時の大きな役職ポップアップ表示
      const revealOverlay = document.getElementById('roleRevealOverlay');
      if (phaseTransition === 'roleReveal') {
        const myCol = COLORS[me.color] || COLORS[0];
        const cardEl = document.getElementById('roleRevealCard');
        cardEl.className = 'role-reveal-card camp-' + me.camp;
        document.getElementById('roleRevealChar').innerHTML = renderCharacterSvg(myCol, false, 118, false);
        document.getElementById('roleRevealIcon').innerHTML = renderRoleIcon(me.camp, me.er, 'lg', false);
        const nameEl = document.getElementById('roleRevealName');
        nameEl.className = 'role-reveal-name camp-' + me.camp;
        nameEl.textContent = me.label;
        revealOverlay.classList.remove('hidden');
      } else {
        revealOverlay.classList.add('hidden');
      }

      // 決着オーバーレイは、吊りや夜・朝などのモーション完了後に表示
      const finishOverlay = document.getElementById('finishOverlay');
      if (phaseTransition === 'toResult') {
        finishOverlay.classList.remove('hidden');
        closeModal();
      } else {
        finishOverlay.classList.add('hidden');
      }

      // ホスト用ボタン表示
      document.getElementById('forceBtn').classList.toggle('hidden', !isHost || !!over || !!phaseTransition);
      document.getElementById('debugAbortBtn').classList.toggle('hidden', !isHost);

      // 上部の設定役職アイコン一覧（ホバー＆クリックで能力説明表示）
      document.getElementById('topRoleBar').innerHTML = (roleBar || []).map(item => `
    <div class="role-bar-item"
         data-camp="${item.c}" data-role="${item.role || ''}"
         onmouseenter="onRoleIconEnter(this)"
         onmouseleave="onRoleIconLeave()"
         onclick="onRoleIconClick(event, this)">
      ${renderRoleIcon(item.c, item.role, 'sm', item.isMe)}
      ${item.isMe ? '<span class="role-bar-me-tag">自分</span>' : ''}
    </div>
  `).join('');

      // 自分の役職アイコン＆ステータス（ここもホバー＆クリックで能力説明表示）
      const myHeaderBox = document.getElementById('myRoleHeaderBox');
      myHeaderBox.dataset.camp = me.camp;
      myHeaderBox.dataset.role = me.er || '';
      myHeaderBox.onmouseenter = () => onRoleIconEnter(myHeaderBox);
      myHeaderBox.onmouseleave = () => onRoleIconLeave();
      myHeaderBox.onclick = (e) => onRoleIconClick(e, myHeaderBox);

      document.getElementById('myRoleIconWrap').innerHTML = renderRoleIcon(me.camp, me.er, 'md');
      const badge = document.getElementById('myRoleBadge');
      badge.textContent = me.label;
      badge.className = 'badge c-' + me.camp;
      document.getElementById('myStatus').textContent = me.alive ? '' : (me.isAsh ? '（⚱️ 灰になった）' : '（💀 死亡）');

      // 役職行動再生中（nightAction）は文字を表示しない
      const statusEl = document.getElementById('actionStatusText');
      if (phaseTransition === 'nightAction') {
        statusEl.textContent = '';
      } else if (phaseTransition === 'morningDeaths') {
        statusEl.textContent = activeMorningDeath
          ? `💀 昨晩、${activeMorningDeath.name} が無残な姿で発見された…`
          : '';
      } else if (phaseTransition === 'morningRat') {
        const rActor = activeMorningRat ? (players.find(p => p.id === activeMorningRat.actor)?.name || '') : '';
        const rTarget = activeMorningRat ? (players.find(p => p.id === activeMorningRat.target)?.name || '') : '';
        statusEl.textContent = activeMorningRat
          ? `🐭 ${rActor} が ${rTarget} を調査したと指さしている！`
          : '';
      } else if (phaseTransition === 'exile') {
        statusEl.textContent = `👢 ${lastExile ? lastExile.name : ''} が村から追放！`;
      } else if (phaseTransition === 'roleReveal') {
        statusEl.textContent = '🎭 役職確認中...';
      } else if (phaseTransition === 'toNight') {
        statusEl.textContent = '🌙 みんな家の中へ戻っています...';
      } else if (phaseTransition === 'toDay') {
        statusEl.textContent = '☀️ 朝になりました！広場へ集合';
      } else if (over || !me.alive) {
        statusEl.textContent = '';
      } else if (ph === 'day') {
        if (myVote !== undefined) {
          const targetName = myVote >= 0 ? (players.find(p => p.id === myVote)?.name + ' に投票済み') : 'スキップ投票済み';
          statusEl.textContent = '✔ ' + targetName + '（変更不可）';
        } else if (me.thiefNotice) {
          statusEl.textContent = `🎭 昨夜奪った役職は「${me.thiefNotice.label}」でした！`;
        } else {
          statusEl.textContent = '家またはキャラをタップして投票';
        }
      } else {
        statusEl.textContent = myNightAction ? '✔ 行動選択済み（変更可）' : '家をタップして行動選択';
      }

      const wrap = document.getElementById('villageWrap');
      const showNightVisual = (ph === 'night' || phaseTransition === 'toNight' || phaseTransition === 'nightAction');
      wrap.classList.toggle('night-mode', showNightVisual);
      document.body.classList.toggle('is-day', !showNightVisual);
      document.body.classList.toggle('is-night', showNightVisual);
      document.getElementById('daySky').classList.toggle('hidden', showNightVisual);
      document.getElementById('nightSky').classList.toggle('hidden', !showNightVisual);

      document.getElementById('phaseTitle').textContent = `Day ${day} ${showNightVisual ? '🌙 夜' : '☀️ 昼'}`;
      document.getElementById('progressText').textContent = phaseTransition
        ? ''
        : (over ? 'ゲーム終了' : `${ph === 'day' ? '投票' : '行動'}完了: ${progress.done}/${progress.total}人`);

      const skipCountBox = document.getElementById('skipCountBox');
      if (ph === 'day' && !phaseTransition && !over) {
        skipCountBox.classList.remove('hidden');
        skipCountBox.textContent = day === 1
          ? `スキップ票: ${skipCount || 0}`
          : `過半数: ${majorityNeeded || 1}票 / スキップ: ${skipCount || 0}`;
      } else {
        skipCountBox.classList.add('hidden');
      }

      renderCenterActions(view, submitted, myNightAction, phaseTransition);

      const housesLayer = document.getElementById('housesLayer');
      const charsLayer = document.getElementById('charsLayer');
      const fxLayer = document.getElementById('fxLayer');
      const count = players.length;

      const nightTargetId = (ph === 'night' && myNightAction && myNightAction.t != null) ? myNightAction.t : null;
      const dayTargetId = (ph === 'day' && myVote != null && myVote >= 0) ? myVote : null;

      let housesHtml = '';
      let fxHtml = '';

      if (renderedGid !== gid) {
        renderedGid = gid;
        charsLayer.innerHTML = players.map(p => `
      <div id="char-${p.id}" class="char-node" onclick="onHouseClick(${p.id})">
        <div class="char-ground-shadow"></div>
        <div class="char-sprite"></div>
        <div class="char-tag"></div>
      </div>
    `).join('') + [0, 1].map(gi => `
      <div id="guest-char-${gi}" class="char-node inside-house" style="pointer-events:none;">
        <div class="char-ground-shadow"></div>
        <div class="char-sprite">${renderCharacterSvg(GRAY_COLOR, false, 56, false)}</div>
      </div>
    `).join('');
      }

      const currentPhaseKey = phaseTransition || ph;
      const isEnteringDay = (phaseTransition === 'toDay' && prevPhase !== 'toDay');
      const isEnteringNight = (phaseTransition === 'toNight' && prevPhase !== 'toNight');
      const isExiling = (phaseTransition === 'exile' && lastExile != null);
      const isNightMotion = (phaseTransition === 'nightAction');
      const isMorningDeaths = (phaseTransition === 'morningDeaths');
      const isMorningRat = (phaseTransition === 'morningRat');

      // 各プレイヤーの座標・奥行き計算
      const posMap = new Map();
      players.forEach((p, idx) => {
        const angle = (2 * Math.PI * idx / count) - (Math.PI / 2);
        const cos = Math.cos(angle);
        const sin = Math.sin(angle);
        const depthRatio = (sin + 1) / 2;
        const depthScale = ELLIPSE_CONFIG.minScale + depthRatio * (ELLIPSE_CONFIG.maxScale - ELLIPSE_CONFIG.minScale);
        const zBase = Math.round(10 + depthRatio * 18);

        const doorLeft = 50 + ELLIPSE_CONFIG.houseRx * cos;
        const doorTop = 50 + ELLIPSE_CONFIG.houseRy * sin + 2.2;
        const frontLeft = 50 + (ELLIPSE_CONFIG.houseRx - 8.5) * cos;
        const frontTop = 50 + (ELLIPSE_CONFIG.houseRy - 8.0) * sin;
        const targetStopLeft = 50 + (ELLIPSE_CONFIG.houseRx - 5.2) * cos;
        const targetStopTop = 50 + (ELLIPSE_CONFIG.houseRy - 5.0) * sin;
        const policeStopLeft = 50 + (ELLIPSE_CONFIG.houseRx - 11.8) * cos;
        const policeStopTop = 50 + (ELLIPSE_CONFIG.houseRy - 11.2) * sin;

        posMap.set(p.id, {
          hLeft: 50 + ELLIPSE_CONFIG.houseRx * cos,
          hTop: 50 + ELLIPSE_CONFIG.houseRy * sin,
          doorLeft,
          doorTop,
          frontLeft,
          frontTop,
          targetStopLeft,
          targetStopTop,
          policeStopLeft,
          policeStopTop,
          pLeft: 50 + ELLIPSE_CONFIG.plazaRx * cos,
          pTop: 50 + ELLIPSE_CONFIG.plazaRy * sin,
          dLeft: 50 + ELLIPSE_CONFIG.deadRx * cos,
          dTop: 50 + ELLIPSE_CONFIG.deadRy * sin,
          depthScale,
          zBase
        });
      });

      // カメラズーム制御
      const centerBox = document.getElementById('villageCenter');
      centerBox.classList.toggle('dimmed-center', isExiling || isMorningDeaths || isMorningRat);

      let nextFxKey = 'none';

      if (isExiling) {
        wrap.style.transform = 'scale(1.22)';
      } else if (isMorningDeaths && activeMorningDeath) {
        const dPos = posMap.get(activeMorningDeath.id);
        if (dPos) {
          const tx = (50 - dPos.dLeft) * 0.45;
          const ty = (50 - dPos.dTop) * 0.45;
          wrap.style.transform = `scale(1.38) translate(${tx}%, ${ty}%)`;
          nextFxKey = `mdeath:${gid}:${day}:${activeMorningDeath.id}`;
          fxHtml += `
        <div class="death-reveal-popup" style="left:${dPos.dLeft}%; top:${dPos.dTop}%;">
          <div style="font-size:10px; color:#fca5a5; font-weight:bold;">${activeMorningDeath.name}</div>
          ${renderRoleIcon(activeMorningDeath.c, activeMorningDeath.role, 'md', false)}
          <div style="font-size:13px; font-weight:900; color:#fbbf24;">${activeMorningDeath.roleText}</div>
        </div>
      `;
        }
      } else if (isMorningRat && activeMorningRat) {
        const tPos = posMap.get(activeMorningRat.target);
        if (tPos) {
          const midX = (50 + tPos.pLeft) / 2;
          const midY = (52 + tPos.pTop) / 2;
          const tx = (50 - midX) * 0.55;
          const ty = (52 - midY) * 0.55;
          wrap.style.transform = `scale(1.32) translate(${tx}%, ${ty}%)`;

          const handX = 50 + (tPos.pLeft - 50) * 0.48;
          const handY = 52 + (tPos.pTop - 52) * 0.48;
          nextFxKey = `mrat:${gid}:${day}:${activeMorningRat.actor}:${activeMorningRat.target}`;
          fxHtml += `
        <svg class="rat-point-svg" viewBox="0 0 100 100" preserveAspectRatio="none">
          <line class="rat-point-line" x1="50" y1="52" x2="${tPos.pLeft}" y2="${tPos.pTop}"/>
        </svg>

        housesHtml += `
      <div class="house-node ${visualAlive ? '' : 'dead'} ${isHouseBombed ? 'bombed' : ''} ${isMe ? 'is-me' : ''} ${p.mate ? 'is-mate' : ''} ${isSelected ? 'selected-target' : ''}"
           style="left:${hLeft}%; top:${hTop}%; z-index:${zBase}; --depth-scale:${depthScale.toFixed(3)};"
           onclick="onHouseClick(${p.id})">
        ${ph === 'day' && !phaseTransition ? `<div class="vote-pill ${votes > 0 ? 'has-votes' : ''}">🗳️ ${votes}</div>` : ''}
        <div class="house-graphic">
          <div class="house-ground-shadow"></div>
          ${isHouseBombed ? `<div class="house-smoke">💨</div>` : ''}
          <div class="house-roof" style="border-bottom-color:${visualAlive ? pColor.hex : '#4b5563'};"></div>
          <div class="house-body">
            ${bombedCrackHtml}
            <div class="house-door"></div>
            ${overlayIcon ? `<span class="house-icon-overlay">${overlayIcon}</span>` : ''}
          </div>
        </div>
        <div class="house-name">${p.name}</div>
        ${subText ? `<div class="house-sub">${subText}</div>` : ''}
        ${invResultHtml}
      </div>
    `;

        const el = document.getElementById('char-' + p.id);
        if (!el) return;

        const spriteEl = el.querySelector('.char-sprite');
        const tagEl = el.querySelector('.char-tag');
        const spriteStateKey = `${p.color}:${visualAlive ? 1 : 0}:${visualAsh ? 1 : 0}`;
        if (spriteEl.dataset.state !== spriteStateKey) {
          spriteEl.dataset.state = spriteStateKey;
          spriteEl.innerHTML = renderCharacterSvg(pColor, !visualAlive, 56, visualAsh);
        }
        tagEl.style.color = pColor.light;
        tagEl.textContent = p.name;

        el.style.setProperty('--depth-scale', depthScale.toFixed(3));
        el.style.zIndex = zBase + 4;
        el.classList.toggle('is-dead', !visualAlive);
        el.classList.toggle('is-ash', !visualAlive && visualAsh);

        if (isBeingExiled) {
          el.classList.remove('inside-house', 'entering-house', 'night-acting', 'night-returning', 'night-entering-door', 'night-step-out', 'is-walking');
          el.style.setProperty('--sx', pLeft + '%');
          el.style.setProperty('--sy', pTop + '%');
          el.classList.add('exile-anim');
        } else {
          el.classList.remove('exile-anim');
          if (ov) {
            const wasInsideHouse = el.classList.contains('inside-house')
              && (ov.mode === 'acting' || ov.mode === 'step-out');
            if (wasInsideHouse) {
              const sx = ov.startLeft !== undefined ? ov.startLeft : doorLeft;
              const sy = ov.startTop !== undefined ? ov.startTop : doorTop;
              el.style.transition = 'none';
              el.classList.remove('inside-house', 'entering-house', 'night-acting', 'night-returning', 'night-entering-door', 'night-step-out', 'is-walking');
              applyCharacterPositionAndFacing(el, p.id, sx, sy);
              void el.offsetWidth;
              el.style.transition = '';
            }
            el.classList.remove('entering-house');
            el.classList.toggle('night-acting', ov.mode === 'acting');
            el.classList.toggle('night-returning', ov.mode === 'returning');
            el.classList.toggle('night-entering-door', ov.mode === 'entering-door');
            el.classList.toggle('night-step-out', ov.mode === 'step-out');
            el.classList.toggle('inside-house', !!ov.inside);
            el.classList.toggle('is-walking', !!ov.walking);
            applyCharacterPositionAndFacing(el, p.id, ov.left, ov.top);
          } else if (isMorningRat && activeMorningRat && activeMorningRat.actor === p.id) {
            el.classList.remove('inside-house', 'entering-house', 'night-acting', 'night-returning', 'night-entering-door', 'night-step-out', 'is-walking');
            el.style.zIndex = 48;
            applyCharacterPositionAndFacing(el, p.id, 50, 52);
          } else if (!visualAlive) {
            el.classList.remove('inside-house', 'entering-house', 'night-acting', 'night-returning', 'night-entering-door', 'night-step-out', 'is-walking');
            applyCharacterPositionAndFacing(el, p.id, dLeft, dTop);
          } else if (isEnteringDay) {
            el.style.transition = 'none';
            el.classList.remove('entering-house', 'night-acting', 'night-returning', 'night-entering-door', 'night-step-out', 'is-walking');
            applyCharacterPositionAndFacing(el, p.id, doorLeft, doorTop);
            el.classList.add('inside-house');
            void el.offsetWidth;
            el.style.transition = '';
            applyCharacterPositionAndFacing(el, p.id, pLeft, pTop);
            el.classList.remove('inside-house');
            el.classList.add('is-walking');
          } else if (isEnteringNight) {
            el.style.transition = 'none';
            el.classList.remove('inside-house', 'entering-house', 'night-acting', 'night-returning', 'night-entering-door', 'night-step-out');
            applyCharacterPositionAndFacing(el, p.id, pLeft, pTop);
            void el.offsetWidth;
            el.style.transition = '';
            applyCharacterPositionAndFacing(el, p.id, doorLeft, doorTop);
            el.classList.add('entering-house', 'is-walking');
          } else if (phaseTransition === 'toNight') {
            applyCharacterPositionAndFacing(el, p.id, doorLeft, doorTop);
            el.classList.add('entering-house', 'is-walking');
          } else if (ph === 'night' || isNightMotion) {
            el.classList.remove('entering-house', 'night-acting', 'night-returning', 'night-entering-door', 'night-step-out', 'is-walking');
            applyCharacterPositionAndFacing(el, p.id, doorLeft, doorTop);
            el.classList.add('inside-house');
          } else {
            el.classList.remove('inside-house', 'entering-house', 'night-acting', 'night-returning', 'night-entering-door', 'night-step-out');
            if (phaseTransition !== 'toDay') {
              el.classList.remove('is-walking');
            }
            applyCharacterPositionAndFacing(el, p.id, pLeft, pTop);
          }
        }
      });

      if (isEnteringDay) {
        if (dayWalkStopTimer) clearTimeout(dayWalkStopTimer);
        dayWalkStopTimer = setTimeout(() => {
          document.querySelectorAll('.char-node.is-walking').forEach(node => node.classList.remove('is-walking'));
        }, 3150);
      }

      housesLayer.innerHTML = housesHtml;
      if (nextFxKey !== lastFxKey) {
        lastFxKey = nextFxKey;
        fxLayer.innerHTML = fxHtml;
      }
      prevPhase = currentPhaseKey;

      const logBox = document.getElementById('combinedLogBox');
      const prevScrollBottom = logBox.scrollHeight - logBox.scrollTop - logBox.clientHeight;
      logBox.innerHTML = renderTimelineLogs(timeline, players, COLORS);
      if ((timeline && timeline.length !== lastTimelineCount) || prevScrollBottom < 30) {
        lastTimelineCount = timeline ? timeline.length : 0;
        logBox.scrollTop = logBox.scrollHeight;
      }
    }

    function renderCenterActions(view, submitted, myNightAction, phaseTransition) {
      const container = document.getElementById('centerActions');
      const {me, ph, day, over, myVote} = view;
      if (over || !me.alive || phaseTransition) {
        container.innerHTML = '';
        return;
      }

      if (ph === 'day') {
        if (myVote !== undefined) {
          container.innerHTML = `<div style="font-size:10px; color:#16a34a; font-weight:bold;">投票待ち...</div>`;
        } else if (day === 1) {
          container.innerHTML = `<button onclick="submitDayVote(-1)">初日確認</button>`;
        } else {
          container.innerHTML = `<button class="secondary" onclick="submitDayVote(-1)">スキップ</button>`;
        }
        return;
      }

      let html = '';
      if (me.sur) {
        const shUsed = me.uses.sur || 0;
        if (shUsed < 3) {
          html += `<button onclick="submitNightAction({sh:1})">🛡️ シールド(${3 - shUsed})</button>`;
        }
      }
      if (me.er === 'bom' && me.bombs > 0) {
        html += `<button class="danger" onclick="submitNightAction({det:1})">💥 起爆(${me.bombs})</button>`;
      }
      html += `<button class="secondary" onclick="submitNightAction({})">何もしない</button>`;
      if (myNightAction) {
        html += `<button class="danger" style="font-size:10px; padding:3px;" onclick="socket.emit('cancelNightAction')">取消</button>`;
      }
      container.innerHTML = html;
    }

    function submitDayVote(targetId) {
      closeModal();
      socket.emit('submitAction', targetId);
    }

    function submitNightAction(actionObj) {
      closeModal();
      socket.emit('submitAction', actionObj);
    }

    function getGuessCampClass(g, meta) {
      if (g.startsWith('r:') || (meta.R && meta.R.includes(g))) return 'guess-r';
      if (g === 'fool' || (meta.G && meta.G.includes(g))) return 'guess-g';
      if (meta.B && meta.B.includes(g)) return 'guess-b';
      return 'guess-g';
    }

    function onHouseClick(targetId) {
      if (!currentState || currentState.mode !== 'game' || currentState.phaseTransition) return;
      const {view, meta} = currentState;
      const {me, players, ph, over, myVote} = view;
      if (over || !me.alive) return;

      const target = players.find(p => p.id === targetId);
      if (!target || !target.alive) return;

      if (ph === 'night' && target.id === me.id) return;

      const modalTitle = document.getElementById('modalTitle');
      const modalSub = document.getElementById('modalSub');
      const modalChoices = document.getElementById('modalChoices');

      modalTitle.textContent = target.id === me.id ? `🏠 あなた（${target.name}）の家` : `🏠 ${target.name} の家`;

      if (ph === 'day') {
        if (myVote !== undefined) {
          modalSub.textContent = 'あなたはすでに投票済みです（昼の投票は変更できません）。';
          modalChoices.innerHTML = '';
        } else {
          const labelTarget = target.id === me.id ? `自分（${target.name}）` : target.name;
          modalSub.textContent = view.day === 1
            ? '初日はモデレーター決め投票です（追放は発生しません）。'
            : `このプレイヤーに投票しますか？（過半数 ${view.majorityNeeded || 1}票で追放・変更不可）`;
          modalChoices.innerHTML = `
        <button class="danger" onclick="submitDayVote(${target.id})">🗳️ ${labelTarget} に投票する</button>
      `;
        }
        document.getElementById('houseModal').classList.remove('hidden');
        return;
      }

      modalSub.textContent = '実行する行動を選択してください（全員決定まで変更可能）';
      const {N, G, TG, LIM, GUESS} = meta;
      const noRepeat = ['doc', 'pol', 'trk'].includes(me.er);
      const isRepeatTarget = noRepeat && me.last[me.er] === target.id;
      const limit = LIM[me.er];
      const used = me.uses[me.er] || 0;
      const hasAbility = TG.includes(me.er) && (!limit || used < limit);

      let choicesHtml = '';

      if (me.rc === 'r') {
        choicesHtml += `<button class="danger" onclick="submitNightAction({t:${target.id}, kill:1})">🔪 ${target.name} を襲撃（キル）する</button>`;
      }

      if (me.er === 'mag') {
        choicesHtml += `<div style="font-size:12px; color:#79c0ff; margin-top:4px;">⚡ 当てる役職を選択して雷を落とす：</div><div class="guess-grid">`;
        choicesHtml += GUESS.map(g => {
          const gName = g.startsWith('r:') ? `赤${N[g.slice(2)]}` : N[g];
          const campCls = getGuessCampClass(g, meta);
          return `<button class="${campCls}" onclick="submitNightAction({t:${target.id}, guess:'${g}'})">${gName}</button>`;
        }).join('');
        choicesHtml += `</div>`;
      } else if (hasAbility) {
        const abilityName = (me.rc === 'r' && G && G.includes(me.er)) ? `赤${N[me.er]}` : N[me.er];
        if (isRepeatTarget) {
          choicesHtml += `<button disabled>✨ ${abilityName}（前夜と同じ対象は不可）</button>`;
        } else {
          const rem = limit ? ` [残り${limit - used}回]` : '';
          choicesHtml += `<button onclick="submitNightAction({t:${target.id}})">✨ ${abilityName}の能力を使う${rem}</button>`;
        }
      }

      if (!choicesHtml) {
        choicesHtml = `<p style="font-size:13px; color:var(--muted); margin:4px 0;">この家に対して使える能力がありません。</p>`;
      }

      modalChoices.innerHTML = choicesHtml;
      document.getElementById('houseModal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('houseModal').classList.add('hidden');
    }
  </script>
</body>

</html>
